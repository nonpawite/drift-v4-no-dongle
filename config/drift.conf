# Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_MOUSE=y

# Encoder (EC11)
CONFIG_EC11=y
# run encoder events globally
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y 

# BLE TX power. 0 dBm is plenty for halves ~30cm apart and a host within 2m.
# +8 dBm roughly triples radio TX current on every connection event.
# Raise to CONFIG_BT_CTLR_TX_PWR_PLUS_4=y if the link turns flaky.
CONFIG_BT_CTLR_TX_PWR_0=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Connection parameters. Higher latency = fewer radio wakeups = better battery.
# This costs nothing in typing latency: a peripheral with data to send transmits
# on the next connection event regardless of the latency setting.
# 30ms interval x (30 + 1) = 930ms idle wake period.
# Keep interval x (latency + 1) under 2s and well under the supervision timeout,
# or macOS rejects the parameter request outright and you get the host defaults.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Windows battery reporting issue workaround
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Debounce settings (reduce chatter, increase stability)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# Idle state timeout. The PMW3610 driver subscribes to ZMK activity state and
# drops the sensor out of performance mode whenever ZMK is not active, so this
# also gates trackball power. Trackball motion counts as activity and wakes it.
CONFIG_ZMK_IDLE_TIMEOUT=15000

# Peripheral battery reporting.
# PROXY sits inside "if FETCHING" in ZMK's Kconfig, so both are required.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

