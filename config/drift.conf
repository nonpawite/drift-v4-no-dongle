# Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_MOUSE=y

# Encoder (EC11)
CONFIG_EC11=y
# run encoder events globally
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y 

# BLE TX power. 0 dBm is plenty for halves ~30cm apart and a host within 2m.
# +8 dBm roughly triples radio TX current on every connection event.
# Raise to CONFIG_BT_CTLR_TX_PWR_PLUS_4=y if the link turns flaky.
CONFIG_BT_CTLR_TX_PWR_0=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# BT_PERIPHERAL_PREF_* is deliberately NOT set here. This file is shared by both
# halves, and on the left half those values land on the SPLIT link, which the
# central already governs via ZMK_SPLIT_BLE_PREF_*. Two sides negotiating the
# same link against each other is how the halves stopped talking. The values
# now live in the per-half conf files, aimed at the link each one actually owns.

# Windows battery reporting issue workaround
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Debounce settings (reduce chatter, increase stability)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# Idle state timeout. The PMW3610 driver subscribes to ZMK activity state and
# drops the sensor out of performance mode whenever ZMK is not active, so this
# also gates trackball power. Trackball motion counts as activity and wakes it.
CONFIG_ZMK_IDLE_TIMEOUT=15000

# Peripheral battery reporting.
# PROXY sits inside "if FETCHING" in ZMK's Kconfig, so both are required.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

