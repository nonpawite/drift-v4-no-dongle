# ==========================
# Split / BLE Settings
# ==========================
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Encoder (EC11)
CONFIG_EC11=y
# run encoder events globally
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED Display
# CONFIG_ZMK_DISPLAY=y

# -----------------------------------
# Power + Sleep Behaviour
# -----------------------------------
CONFIG_ZMK_SLEEP=y
# Deep sleep (system off, ~20uA) after 10 min idle, vs ~1mA staying connected.
# Also cuts VEXT, so the trackball stops drawing its rest current entirely.
# Cost: 1-2s BLE reconnect on the first keypress after waking.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
# Battery service. The central reports its own and the proxied peripheral level,
# so this must stay on; it also conflicted with CONFIG_BT_BAS=y in drift.conf.
CONFIG_BT_BAS=y

# -------------------------------------------------
# Keyscan Tuning
# -------------------------------------------------
# Longer debounce -> more stability, less "chatter"
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# ---------------------------
# Core Drivers
# ---------------------------
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_PMW3610_ALT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_EXT_POWER=y

# ----------------------------
# BLE TX power (see drift.conf)
# ----------------------------
CONFIG_BT_CTLR_TX_PWR_0=y

# ------------------------------------------------
# Host link connection parameters (right half only)
# ------------------------------------------------
# These apply to this half's connection to the computer, where it is the
# peripheral. On the split link this half is the central, so they do not touch
# it -- the split link is set by ZMK_SPLIT_BLE_PREF_* in ZMK's own defaults.
# Higher latency = fewer radio wakeups, and it costs nothing in typing latency:
# a peripheral with data to send transmits on the next connection event anyway.
# That reasoning still holds, so LATENCY stays at 30; it is the interval, not the
# latency, that caps pointer report rate.
# Interval is now 7.5-15ms (was 15-30ms) so the trackball can report at 66-133Hz
# instead of 33-66Hz. This is the main radio cost of the pointer work: roughly
# double the connection events while connected.
# Keep interval x (latency + 1) under 2s or macOS rejects the request outright.
# 15ms x 31 = 465ms, still well inside that.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --------------------------------------------
# Motion logic
# --------------------------------------------
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y
# Was 1, against ZMK's default of 20. zmk_hog_send_mouse_report does
# k_msgq_put(..., K_MSEC(100)) (hog.c), so a full queue BLOCKS the producer for
# up to 100ms before it drops the oldest report. At depth 1 any report generated
# while the previous one waits on the radio stalls the input path, which is felt
# as intermittent pointer lag rather than a steady low rate. 8 absorbs a few
# connection intervals without letting a long backlog of stale motion build up.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=8
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=50

# ------------------------------------------------------------
# FYI: general nrf52840 promicro clone report rate = every 8ms
# ------------------------------------------------------------
# 8ms = ~125Hz, matching the promicro clone's own rate above. The driver's
# Kconfig calls 8ms a USB-only value because it floods the HID queue over the
# air -- that only holds at the stock 15-30ms connection interval. With the
# 7.5-15ms set above, and queue depth 8 instead of 1, the link can carry it.
# Back to 16 if the radio cost is not worth it.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=8

# ------------------------------------------
# Rest / Run timings (ms)
# ------------------------------------------
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=300
# Each downshift time is validated against a floor derived from its sample
# period (pmw3610.c:197-237), and a value below the floor returns -EINVAL,
# which aborts the rest of the sensor init chain and leaves the trackball dead.
#   RUN   : 32ms .. 8160ms
#   REST1 : 16 x REST1_SAMPLE (320ms) .. 255 x that
#   REST2 : 128 x REST2_SAMPLE (25600ms) .. 255 x that
# So REST2 cannot go below 25600ms while REST2_SAMPLE is 200ms. Raise the
# others if the first flick after a pause feels laggy.
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=250
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=1000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=30000
