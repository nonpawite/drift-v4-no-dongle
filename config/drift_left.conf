# ==========================
# Sleep / Power Management
# ==========================
CONFIG_ZMK_SLEEP=y
# Deep sleep (system off, ~20uA) after 10 min idle, vs ~0.5mA staying connected.
# Cost: 1-2s BLE reconnect on the first keypress after waking.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# ==========================
# Split link parameters
# ==========================
# This half is only ever a peripheral to the right half, so BT_PERIPHERAL_PREF_*
# lands on the split link. The central creates that link with
# ZMK_SPLIT_BLE_PREF_INT=6 / LATENCY=30 / TIMEOUT=400, and Zephyr then has this
# side auto-send its own parameter update ~5s later
# (CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y). Pin the same values so that request
# is a no-op instead of a renegotiation.
# Leaving these unset is NOT equivalent: Zephyr defaults to MIN_INT=24/MAX_INT=40
# with latency 0 and a 420ms supervision timeout, which is worse on both battery
# and margin.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ==========================
# Keyscan Filtering
# ==========================
# Note: debounce (ms) → higher = fewer false presses, slower response
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

