# ==========================
# Sleep / Power Management
# ==========================
CONFIG_ZMK_SLEEP=y
# Deep sleep (system off, ~20uA) after 30 min idle, vs ~0.5mA staying connected.
# Cost: 1-2s BLE reconnect on the first keypress after waking.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ==========================
# Keyscan Filtering
# ==========================
# Note: debounce (ms) → higher = fewer false presses, slower response
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# OLED Display
# CONFIG_ZMK_DISPLAY=y